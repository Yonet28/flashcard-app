openapi: 3.0.0
info:
  title: FlashMaster API
  description: API for managing flashcards with Leitner system progression.
  version: 1.0.0

# --- SERVER CONFIGURATION ---
# Updated to port 5000 as defined in your index.js
servers:
  - url: http://localhost:5000
    description: Development Server

paths:
  # --- AUTHENTICATION ROUTES (Mounted on /auth) ---
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: User created successfully
        400:
          description: Username taken or invalid data

  /auth/login:
    post:
      summary: User login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  token:
                    type: string
                  role:
                    type: string
        401:
          description: Invalid credentials

  # --- FOLDERS ROUTES ---
  /folders:
    get:
      summary: Get all folders for a user (including global ones)
      tags: [Folders]
      parameters:
        - in: query
          name: userId
          schema:
            type: string
          required: true
      responses:
        200:
          description: List of folders
    
    post:
      summary: Create a new folder (Global if admin)
      tags: [Folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, userId]
              properties:
                name:
                  type: string
                userId:
                  type: string
      responses:
        201:
          description: Folder created

  /folders/{id}:
    delete:
      summary: Delete a folder and its content
      tags: [Folders]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        200:
          description: Folder and content deleted
        403:
          description: Forbidden (Not owner or admin)

  # --- CARDS ROUTES ---
  /cards:
    get:
      summary: Get all cards for a user (personal + global)
      tags: [Cards]
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of personalized cards with progress
        400:
          description: Missing UserId

    post:
      summary: Create a new card
      tags: [Cards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, answer, userId]
              properties:
                question:
                  type: string
                answer:
                  type: string
                userId:
                  type: string
                folderId:
                  type: string
      responses:
        201:
          description: Card created

  /cards/{id}:
    put:
      summary: Update a card's content
      tags: [Cards]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                answer:
                  type: string
                userId:
                  type: string
                userRole:
                  type: string
      responses:
        200:
          description: Card updated

    delete:
      summary: Delete a card
      tags: [Cards]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        200:
          description: Card deleted

  # --- PROGRESS & REVIEW ROUTES ---
  # Added according to your latest router endpoints
  /cards/{id}/review:
    post:
      summary: Submit a review result (Updates CardProgress)
      tags: [Cards]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, isValid]
              properties:
                userId:
                  type: string
                isValid:
                  type: boolean
      responses:
        200:
          description: Progress updated

  /cards/{id}/answer:
    patch:
      summary: Update card progression level (Leitner logic)
      tags: [Cards]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, isValid]
              properties:
                userId:
                  type: string
                isValid:
                  type: boolean
      responses:
        200:
          description: Answer processed
        400:
          description: Too early for review
        403:
          description: Unauthorized